{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"author="Bruno Bortolon">

    <title>SoftControl</title>

    <!-- CSS Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Ícones Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS Próprio -->
    <link rel="stylesheet" href="{% static 'styles/style.css' %}">

    <!-- Link Favicon -->
    <link rel="shortcut icon" href="{% static 'assets/imagens/empresa/logo/favicon.png' %}" type="image/x-icon">

    <style>
        @media screen and (max-width: 768px) {
            .banner{
                background-image: url("{% static 'assets/imagens/empresa/banner/banner-completo-pq.png' %}");
            }
        }
        
        @media screen and (min-width: 768px) {
            .banner {
                background-image: url("{% static 'assets/imagens/empresa/banner/banner-completo.png' %}");
            }
        }
    </style>
</head>
<body>
    {% for noticia in noticias %}
        <h1>{{ noticia.titulo }}</h1>
        <img src="{{ noticia.imagem.url }}" alt="{{ noticia.titulo }}"></img>

        <p>{{ noticia.data }}</p>
        <p>{{ noticia.fonte }}</p>
        <p>{{ noticia.texto }}</p>
    {% endfor %}
</body>
</html>
